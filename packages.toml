# The packages this catalog offers. One table per package; `tag` is the release tag in `repo`.
# `python3 scripts/gen_catalog.py` reads the public release and writes catalog.xml; CI does it and signs (sign.yml).
# Versions count 0.0.N (ADR 0064).
capabilities_ref = "v0.0.21"  # fs-interfaces tag whose schema/capabilities.txt is THE capability list

[[package]]
id = "fs-packages"
name = "FreeSynergy.Packages"
summary = "Install, update and remove FreeSynergy programs, frontends, components and themes"
description = { en = "FreeSynergy Packages: install, update and remove FreeSynergy programs, frontends, components and themes. Everything comes from signed catalogs and is checked against the project key before it is installed; a failed update is rolled back.", de = "FreeSynergy Packages: Programme, Frontends, Komponenten und Themes von FreeSynergy installieren, aktualisieren und entfernen. Alles stammt aus signierten Katalogen und wird vor der Installation gegen den Projektschlüssel geprüft; ein fehlgeschlagenes Update wird zurückgerollt." }
repo = "FreeSynergy/fs-packages"
tag = "v0.0.22"
asset = "fs-packages-{version}-linux-x86_64.tar.gz"
kind = "program"

