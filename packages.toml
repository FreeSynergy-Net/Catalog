# The packages this catalog offers. One table per package; `tag` is the release tag in `repo`.
# `python3 scripts/gen_catalog.py` reads the public release and writes catalog.xml; CI does it and signs (sign.yml).
# Versions count 0.0.N (ADR 0064).

[[package]]
id = "fs-store"
name = "FreeSynergy.Store"
summary = "Install, update and extend FreeSynergy programs"
description = "The store of FreeSynergy: it installs the programs you choose from signed catalogs, keeps them up to date, and takes them away again. Every file is checked against the project key before anything is installed, and a failed update is rolled back."
repo = "FreeSynergy/fs-store"
tag = "v0.0.16"
asset = "fs-store-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-tasks"
name = "FreeSynergy.Tasks"
summary = "Tasks and Kanban"
description = "Plan what has to be done: lists, status and Kanban views, due dates, relations between tasks, and import and export as iCalendar. Your tasks stay in your own data folder."
repo = "FreeSynergy/fs-tasks"
tag = "v0.0.8"
asset = "fs-tasks-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-people"
name = "FreeSynergy.People"
summary = "People and contacts"
description = "Your people and contacts: cards with names, mail, phone and notes, groups of people, and vCard import and export. Everything stays in your own data folder."
repo = "FreeSynergy/fs-people"
tag = "v0.0.3"
asset = "fs-people-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-calendar"
name = "FreeSynergy.Calendar"
summary = "Calendar and events"
description = "Plan your days: events with times and zones, repeating events, a month, week and day view, and import and export as iCalendar. Your events stay in your own data folder."
repo = "FreeSynergy/fs-calendar"
tag = "v0.0.2"
asset = "fs-calendar-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-files"
name = "FreeSynergy.Files"
summary = "Files and folders"
description = "Your files in one place, kept under their real names: folders, files, upload and download, rename, move, copy, trash and restore, and storage places. Pictures are listed as a gallery facet. What is not built yet is shown and says so."
repo = "FreeSynergy/fs-files"
tag = "v0.0.10"
asset = "fs-files-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-wiki"
name = "FreeSynergy.Wiki"
summary = "Notes that belong together"
description = "Notes that belong together: pages with blocks, a tree of pages, each page in German and English as one page with a language switch, and read-only access to the project documentation. Your pages stay in your own data folder."
repo = "FreeSynergy/fs-wiki"
tag = "v0.0.12"
asset = "fs-wiki-{version}-linux-x86_64.tar.gz"
kind = "program"

[[package]]
id = "fs-maps"
name = "FreeSynergy.Maps"
summary = "Places and maps"
description = "Your places as lists and sheets. A first version: there is no map view yet, only the lists and the sheet of each place."
repo = "FreeSynergy/fs-maps"
tag = "v0.0.2"
asset = "fs-maps-{version}-linux-x86_64.tar.gz"
kind = "program"

# A mirrored server (ADR 0077): the upstream version is the tag (`v26.11_2` = upstream 26.11_2, our build 1; a later build of it would be
# `v26.11_2-fs2`), the package is held to format 2
# on its own (`schema = 2`) while the other entries stay on format 1. Needs a store from 0.0.13 on (older ones skip it).
# `gateway.reverse-proxy` is `planned` in fs-interfaces (unreviewed/planned-capabilities, not tagged yet). This entry is checked green only after
# fs-interfaces is released with it and `capabilities_ref` (default v0.0.19) points at that tag; the real CI check is red until then, by design.
[[package]]
id = "zentinel"
name = "Zentinel"
summary = "Reverse proxy with TLS, routing and rate limits"
repo = "FreeSynergy/fs-zentinel"
tag = "v26.11_2"
asset = "zentinel-{version}-linux-amd64.tar.gz"
kind = "server"
schema = 2
min_store = "0.0.13"
provides = ["gateway.reverse-proxy"]
upstream = "https://github.com/zentinelproxy/zentinel"
source_code = "https://github.com/FreeSynergy/fs-zentinel/releases/download/v26.11_2/zentinel-26.11_2-source.tar.gz"
maker = "Zentinel project"
icon = "https://raw.githubusercontent.com/FreeSynergy/fs-catalog/main/icons/server.png"
icon_sha256 = "4d55f0d65e3e808a71fab736f8e7b659390a19b3ed7d7cb0710ef2588b09526d"

[package.description]
en = "The Zentinel reverse proxy (Apache-2.0), mirrored and signed by FreeSynergy: TLS termination, routing by host and path, load balancing, health checks, rate limiting and reload while running. It installs as a system service that is not switched on by itself."
de = "Der Reverse-Proxy Zentinel (Apache-2.0), gespiegelt und signiert von FreeSynergy: TLS-Abschluss, Routing nach Host und Pfad, Lastverteilung, Gesundheitsprüfung, Ratenbegrenzung und Neuladen im Betrieb. Er wird als Systemdienst installiert, der nicht von selbst eingeschaltet wird."

